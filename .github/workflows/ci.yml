name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  packages: write

jobs:
  # A three-segment tag (v0.82.1) is an Android hotfix line: only the APK is
  # rebuilt and published, because the server bundle, audio, Windows and NAS
  # assets already exist in the v0.82 release and would be byte-identical here.
  # Everything else (main branch, pull requests, v0.83) stays on the full line.
  meta:
    runs-on: ubuntu-latest
    outputs:
      android_only: ${{ steps.line.outputs.android_only }}
    steps:
      - name: Classify the release line
        id: line
        run: |
          android_only=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            case "${GITHUB_REF_NAME#v}" in
              *.*.*) android_only=true ;;
            esac
          fi
          echo "android_only=$android_only" >> "$GITHUB_OUTPUT"
          echo "android_only=$android_only"

  build:
    needs: meta
    runs-on: ubuntu-latest
    # Management bundle is pure-Go: the CGO libFLAC/ALSA audio backend is built
    # and tested separately in the audio job. Without this, Linux defaults to
    # CGO_ENABLED=1 and `go test ./...` fails on the decode/player cgo files
    # (libflac-dev / libasound2-dev are not installed in this job).
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Frontend regression tests
        run: node --test internal/web/*.test.cjs

      - name: Server unit tests
        run: go test ./...

      - name: Agent unit tests
        working-directory: agent
        run: go test ./...

      - name: End-to-end smoke test (enforce mode)
        run: sh scripts/smoke-test.sh

      - name: Build release bundle
        if: needs.meta.outputs.android_only != 'true'
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.68"
          fi
          VERSION="$VERSION" sh scripts/build-release.sh

      - name: Package the MCP player plugin
        if: needs.meta.outputs.android_only != 'true'
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.68"
          fi
          VERSION="$VERSION" sh scripts/build-plugin.sh

      - name: Prepare draft GitHub Release
        if: github.ref_type == 'tag' && needs.meta.outputs.android_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ] || { echo "Refusing to overwrite a published release"; exit 1; }
            gh release upload "$GITHUB_REF_NAME" \
              release/Zephyr-HiFi-Kit-server-*.tar.gz \
              release/Zephyr-HiFi-Kit-server-*-windows-amd64.zip \
              release/Zephyr-HiFi-Kit-terminal-*-linux.tar.gz \
              release/Zephyr-HiFi-Kit-terminal-*-linux-*.deb \
              release/Zephyr-HiFi-Kit-mcp-plugin-*.zip \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              release/Zephyr-HiFi-Kit-server-*.tar.gz \
              release/Zephyr-HiFi-Kit-server-*-windows-amd64.zip \
              release/Zephyr-HiFi-Kit-terminal-*-linux.tar.gz \
              release/Zephyr-HiFi-Kit-terminal-*-linux-*.deb \
              release/Zephyr-HiFi-Kit-mcp-plugin-*.zip \
              --draft --verify-tag \
              --title "Zephyr HiFi Kit $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Upload management artifacts
        if: needs.meta.outputs.android_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Zephyr-HiFi-Kit-management
          path: |
            release/Zephyr-HiFi-Kit-server-*.tar.gz
            release/Zephyr-HiFi-Kit-server-*-windows-amd64.zip
            release/Zephyr-HiFi-Kit-terminal-*-linux.tar.gz
            release/Zephyr-HiFi-Kit-terminal-*-linux-*.deb
            release/Zephyr-HiFi-Kit-mcp-plugin-*.zip
          if-no-files-found: error
          retention-days: 7

  # Run the exact Linux-cross-built release executable on a real Windows host.
  # No failure is optional: publish-release depends on this job succeeding.
  windows:
    needs: [meta, build]
    if: needs.meta.outputs.android_only != 'true'
    runs-on: windows-latest
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Server unit tests on Windows
        run: go test ./...
      - uses: actions/download-artifact@v4
        with:
          name: Zephyr-HiFi-Kit-management
          path: ${{ runner.temp }}/management-artifact
      - name: Windows package and isolated launcher smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { '0.68' }
          $name = "Zephyr-HiFi-Kit-server-$version-windows-amd64"
          $zip = Join-Path $env:RUNNER_TEMP "management-artifact/$name.zip"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Missing Windows release: $zip" }
          # Spaces and non-ASCII characters exercise literal, absolute paths.
          $sandbox = Join-Path $env:RUNNER_TEMP ("Zephyr Windows 测试 " + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $sandbox | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $sandbox
          $bundle = Join-Path $sandbox $name
          $exe = Join-Path $bundle 'Zephyr-HiFi-Kit-server.exe'
          foreach ($file in @('Zephyr-HiFi-Kit-server.exe', 'start.ps1', 'README.cn.md', 'README.en.md', 'INSTALL.md', 'LICENSE', 'SHA256SUMS', 'dist/SHA256SUMS', 'dist/agent-install.sh')) {
            if (-not (Test-Path -LiteralPath (Join-Path $bundle $file) -PathType Leaf)) { throw "Missing package file: $file" }
          }
          if (Test-Path -LiteralPath (Join-Path $bundle 'hifihub-server.exe')) { throw 'Unexpected legacy public executable name' }
          foreach ($line in Get-Content -LiteralPath (Join-Path $bundle 'SHA256SUMS')) {
            if ($line -notmatch '^([a-fA-F0-9]{64}) [ *](.+)$') { throw "Invalid checksum line: $line" }
            $expected = $Matches[1]
            $file = Join-Path $bundle $Matches[2]
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash -ne $expected) { throw "Checksum mismatch: $file" }
          }
          $cwd = Join-Path $sandbox 'unrelated working directory'
          New-Item -ItemType Directory -Path $cwd | Out-Null
          foreach ($mode in @('defaults', 'overrides')) {
            $env:LOCALAPPDATA = Join-Path $sandbox "$mode local app data"
            $data = Join-Path $env:LOCALAPPDATA 'Zephyr-HiFi-Kit/data'
            $dist = Join-Path $bundle 'dist'
            if ($mode -eq 'overrides') {
              $data = Join-Path $sandbox 'custom data'
              $env:HIFIHUB_DATA_DIR = $data
              $env:HIFIHUB_GPG_HOME = Join-Path $data 'custom gnupg'
              $env:HIFIHUB_MOUNT_DIR = Join-Path $data 'custom mounts'
              $env:HIFIHUB_MOUNT_CRED_DIR = Join-Path $data 'custom cifs'
              $dist = Join-Path $sandbox 'custom dist'
              Copy-Item -LiteralPath (Join-Path $bundle 'dist') -Destination $dist -Recurse
              $env:HIFIHUB_DIST_DIR = $dist
            }
            New-Item -ItemType Directory -Path $data | Out-Null
            $sentinel = Join-Path $data 'keep-existing.txt'
            Set-Content -LiteralPath $sentinel -Value 'preserve-existing-data'
            $listener = [Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
            $listener.Start()
            $port = $listener.LocalEndpoint.Port
            $listener.Stop()
            $env:HIFIHUB_LISTEN = "127.0.0.1:$port"
            $env:HIFIHUB_ZAT_ADDR = '127.0.0.1:0'
            $base = "http://127.0.0.1:$port"
            $stdout = Join-Path $sandbox "$mode.stdout.log"
            $stderr = Join-Path $sandbox "$mode.stderr.log"
            $launcher = Join-Path $bundle 'start.ps1'
            $process = Start-Process -FilePath (Get-Command pwsh).Source -ArgumentList @('-NoProfile', '-NonInteractive', '-File', "`"$launcher`"") -WorkingDirectory $cwd -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            try {
              $health = $null
              for ($attempt = 0; $attempt -lt 60; $attempt++) {
                if ($process.HasExited) { throw "Launcher exited: $($process.ExitCode)" }
                try { $health = Invoke-RestMethod "$base/api/v1/health" -TimeoutSec 2 } catch { }
                if ($null -ne $health) { break }
                Start-Sleep -Milliseconds 500
              }
              if ($null -eq $health -or $health.status -ne 'ok' -or $health.platform -ne 'windows') { throw 'Windows health check failed' }
              if ($health.version -cne $version -or $health.signature_mode -ne 'enforce' -or $health.play_gate -ne $true) { throw 'Version or protection defaults changed' }
              $metrics = Invoke-RestMethod "$base/metrics/server"
              if ($metrics.version -cne $version) { throw 'Metrics version mismatch' }
              $html = (Invoke-WebRequest "$base/").Content
              if ($html -notmatch 'Zephyr HiFi Kit') { throw 'Console brand missing' }
              $update = Invoke-RestMethod "$base/api/v1/update/status"
              if ($update.server.auto_apply -ne $false -or $update.policy.enabled -ne $false -or $update.server.checked_at) { throw 'Automatic updates must be off' }
              foreach ($file in @('agent-install.sh', 'SHA256SUMS', "hifihub-agent_${version}_amd64.deb", "hifihub-agent_${version}_arm64.deb", "hifihub-agent_${version}_armhf.deb")) {
                $download = Join-Path $sandbox "$mode-$file"
                Invoke-WebRequest "$base/dl/$file" -OutFile $download
                if ((Get-FileHash -LiteralPath $download).Hash -ne (Get-FileHash -LiteralPath (Join-Path $dist $file)).Hash) { throw "dist download mismatch: $file" }
              }
              if ((Get-Content -LiteralPath $sentinel -Raw).Trim() -ne 'preserve-existing-data') { throw 'Existing data was changed' }
              if (-not (Test-Path -LiteralPath (Join-Path $data 'hifihub.db'))) { throw 'Data directory override/default not used' }
              $subdirs = if ($mode -eq 'defaults') { @('gnupg', 'mounts', 'cifs') } else { @('custom gnupg', 'custom mounts', 'custom cifs') }
              foreach ($dir in $subdirs) {
                if (-not (Test-Path -LiteralPath (Join-Path $data $dir) -PathType Container)) { throw "Missing data subdirectory: $dir" }
              }
            } finally {
              # Stop only the executable in this isolated package, then its shell.
              Get-Process -Name 'Zephyr-HiFi-Kit-server' -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $exe } | Stop-Process -Force
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
              Get-Content -LiteralPath $stdout, $stderr
            }
          }

  # Audio backend verification + audio-enabled release assets. The CGO libFLAC
  # decoder and ALSA sink cannot be built on the pure-Go build host, so this job
  # compiles them on native Linux runners (amd64 + arm64) and exercises the real
  # audio path: the ALSA "null" loopback needs no sound hardware and the FLAC
  # round-trip asserts bit-exact PCM. armhf audio is built by
  # scripts/build-audio-cross.sh on a provisioned host (no native runner).
  audio:
    needs: [meta, build]
    if: needs.meta.outputs.android_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install audio dev libraries (libFLAC + ALSA + flac CLI)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libflac-dev libasound2-dev flac

      - name: CGO audio build + ALSA null loopback + FLAC round-trip + bundle
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.68"
          fi
          TEST=1 AUDIO=1 VERSION="$VERSION" sh scripts/build-release.sh

      - name: Upload audio bundle artifact (non-tag builds)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Zephyr-HiFi-Kit-audio-${{ runner.arch }}
          path: |
            release/Zephyr-HiFi-Kit-server-*-audio-*.tar.gz
            release/Zephyr-HiFi-Kit-terminal-*-audio-*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Attach audio assets to release (tag builds)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Audio debs keep their internal /dl/ names and live in separate audio
          # tarballs, never clobbering the independently published management debs.
          gh release upload "$GITHUB_REF_NAME" \
            release/Zephyr-HiFi-Kit-server-*-audio-*.tar.gz \
            release/Zephyr-HiFi-Kit-terminal-*-audio-*.tar.gz \
            --clobber

  # Android terminal APK. The Go c-shared core (libzatagent.so) is cross-built
  # with the NDK clang toolchain + AAudio backend (arm64-v8a + armeabi-v7a), then
  # the Kotlin foreground-service / WebView shell is assembled with Gradle. This
  # cannot run on the pure-Go management host (needs NDK + SDK + JDK 17), so the
  # SDK is provisioned explicitly here. Signing uses the ANDROID_KEYSTORE_* secrets
  # when present; otherwise the release build falls back to debug signing (still
  # installable). The APK is the Zephyr-HiFi-Kit-terminal-<version>.apk release asset.
  android:
    needs: build
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_NDK_HOME: /opt/android-sdk/ndk/26.3.11579264
      NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 34 + NDK r26d + CMake 3.22.1
        run: |
          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R "$USER":"$USER" "$ANDROID_HOME"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android core host unit tests
        working-directory: agent
        env:
          CGO_ENABLED: 0
        run: go test ./internal/androidcore/...

      # The APK bakes the tag version via ldflags and -PzephyrVersion, but the
      # committed defaults must match it too, otherwise the fleet's version
      # reporting and any local build diverge from the release. Fail closed if the
      # constants were not bumped in the same commit as the tag.
      - name: Assert committed Android versions match the tag
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          COMMITTED=$(grep -m1 'var Version = ' agent/internal/androidcore/core.go | sed -E 's/.*"(.*)".*/\1/')
          [ "$COMMITTED" = "$VERSION" ] || { echo "::error::androidcore.Version is $COMMITTED but tag is $VERSION; commit the matching constant before tagging"; exit 1; }
          GRADLE=$(grep -m1 'zephyrVersion' android/app/build.gradle.kts | sed -E 's/.*orElse\("(.*)"\).*/\1/')
          [ "$GRADLE" = "$VERSION" ] || { echo "::error::build.gradle.kts zephyrVersion default is $GRADLE but tag is $VERSION"; exit 1; }

      - name: Build APK (NDK c-shared + AAudio + Gradle assembleRelease)
        env:
          KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.68"
          fi
          VERSION="$VERSION" sh scripts/build-android.sh

      - name: Verify native libs packaged + JNI linkage
        run: |
          APK=$(ls release/Zephyr-HiFi-Kit-terminal-*.apk)
          echo "== native libs in APK =="
          unzip -l "$APK" | grep -E 'lib/.*libzat(agent|jni)\.so'
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          tmp=$(mktemp -d)
          for abi in arm64-v8a armeabi-v7a; do
            unzip -o -q "$APK" "lib/$abi/libzatjni.so" "lib/$abi/libzatagent.so" -d "$tmp"
            echo "== $abi: libzatjni.so DT_NEEDED =="
            "$READELF" -d "$tmp/lib/$abi/libzatjni.so" | grep NEEDED
            "$READELF" -d "$tmp/lib/$abi/libzatjni.so" | grep -Eq '\(NEEDED\).*\[libzatagent\.so\]' \
              || { echo "!! libzatjni.so DT_NEEDED for libzatagent.so is not the bare basename"; exit 1; }
            echo "== $abi: libzatagent.so SONAME =="
            "$READELF" -d "$tmp/lib/$abi/libzatagent.so" | grep -Eq '\(SONAME\).*\[libzatagent\.so\]' \
              || { echo "!! libzatagent.so is missing SONAME libzatagent.so"; exit 1; }
          done

      - name: Upload APK artifact (non-tag builds)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Zephyr-HiFi-Kit-terminal-apk
          path: release/Zephyr-HiFi-Kit-terminal-*.apk
          retention-days: 7

      - name: Attach APK to release (tag builds)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/Zephyr-HiFi-Kit-terminal-*.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/Zephyr-HiFi-Kit-terminal-*.apk \
              --draft --verify-tag --title "Zephyr HiFi Kit $GITHUB_REF_NAME" --generate-notes
          fi

  # AAudio runtime verification on an Android emulator. The c-shared build above
  # proves the AAudio CGO backend compiles and links; this job exercises the real
  # open/write/drain/close path (S16/S24/S32) against the emulator's audio output.
  # The player test binary is cross-compiled for android/amd64 with the NDK and
  # run via adb. Exclusive sharing may be unavailable on the emulator; Open falls
  # back to shared, so the full path is still validated.
  android-aaudio:
    needs: build
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      ANDROID_NDK_HOME: /opt/android-sdk/ndk/26.3.11579264
      NDK_VERSION: 26.3.11579264
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install SDK + NDK r26d + emulator system-image (API 34 x86_64)
        run: |
          sudo mkdir -p "$ANDROID_HOME"
          sudo chown -R "$USER":"$USER" "$ANDROID_HOME"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdtools/cmdline-tools/* "$ANDROID_HOME/cmdline-tools/latest/"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "emulator" "ndk;$NDK_VERSION" "system-images;android-34;google_apis;x86_64"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AAudio loopback on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          # The runner executes each script line as a separate `sh -c`, so shell
          # state (cd, exported vars) does not persist between lines. Every line
          # is self-contained: inline the NDK CC, cd within the build line, and
          # call adb by absolute path.
          script: |
            cd agent && CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang" GOFLAGS=-mod=mod go test -c -o /tmp/player.test ./internal/player
            "$ANDROID_HOME/platform-tools/adb" push /tmp/player.test /data/local/tmp/player.test
            "$ANDROID_HOME/platform-tools/adb" shell chmod 755 /data/local/tmp/player.test
            "$ANDROID_HOME/platform-tools/adb" shell /data/local/tmp/player.test -test.v -test.run TestAAudio

  # NAS / container server image (QNAP Container Station, Synology Container
  # Manager, TrueNAS, Unraid). Audio-capable CGO libFLAC server on debian-slim
  # with gnupg for enforce mode; state lives in the /data volume, no systemd.
  # Built natively per arch (no qemu CGO emulation), runtime-tested in a real
  # container (health + /dl/ whitelist + unsigned-artifact rejection), then
  # pushed to GHCR per-arch; nas-manifest joins them into a multi-arch index.
  # Offline NAS hosts get docker-save tarballs as release assets instead.
  nas-image:
    needs: [meta, build]
    if: needs.meta.outputs.android_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set container version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.68"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: Zephyr-HiFi-Kit-management
          path: /tmp/bundle-artifact

      - name: Build image
        run: |
          # The management artifact also contains terminal tarballs and a zip.
          # Require exactly one server tar and verify its exact versioned name.
          shopt -s nullglob
          bundles=(/tmp/bundle-artifact/Zephyr-HiFi-Kit-server-*.tar.gz)
          [ "${#bundles[@]}" -eq 1 ] || { echo "Expected exactly one management server tarball"; exit 1; }
          [ "${bundles[0]}" = "/tmp/bundle-artifact/Zephyr-HiFi-Kit-server-${VERSION}.tar.gz" ] || { echo "Unexpected server tarball"; exit 1; }
          cp "${bundles[0]}" /tmp/bundle.tar.gz
          docker build --build-arg VERSION="$VERSION" -f packaging/docker/Dockerfile -t zephyr-nas:test .

      - name: Container runtime test (enforce + /dl/ whitelist + rejection)
        run: |
          mkdir -p /tmp/nasdata
          tar -xzf /tmp/bundle.tar.gz -C /tmp
          cp -r "/tmp/Zephyr-HiFi-Kit-server-${VERSION}/server/dist" /tmp/nasdata/dist
          sudo chown -R 1000:1000 /tmp/nasdata
          docker run -d --name zephyr-nas-test -p 18080:8080 -v /tmp/nasdata:/data zephyr-nas:test
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health >/tmp/health.json 2>/dev/null; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { docker logs zephyr-nas-test; exit 1; }
          cat /tmp/health.json
          grep -q '"signature_mode":"enforce"' /tmp/health.json
          grep -q '"play_gate":true' /tmp/health.json
          curl -fsS -o /dev/null -w 'dl-script %{http_code}\n' http://127.0.0.1:18080/dl/agent-install.sh
          curl -fsS -o /dev/null -w 'dl-sums %{http_code}\n' http://127.0.0.1:18080/dl/SHA256SUMS
          code=$(curl -s -L -o /tmp/trav.out -w '%{http_code}' --path-as-is 'http://127.0.0.1:18080/dl/..%2f..%2fetc%2fpasswd')
          [ "$code" = 404 ] || { echo "!! /dl/ traversal not rejected: $code"; exit 1; }
          grep -q 'root:' /tmp/trav.out && { echo "!! /dl/ leaked file content"; exit 1; }
          docker exec zephyr-nas-test sh -eu -c '
            base=http://127.0.0.1:8080/api/v1
            origin=http://127.0.0.1:8080
            anonymous=$(curl -s -o /tmp/anonymous.json -w "%{http_code}" -X POST "$base/apps" -H "Origin: $origin" -H "Content-Type: application/json" -d "{}")
            [ "$anonymous" = 401 ]
            curl -fsS -c /tmp/admin.cookies -H "Origin: $origin" -H "Content-Type: application/json" -d "{\"password\":\"container-smoke-admin-only\",\"display_name\":\"Container Smoke\"}" "$base/settings/setup" >/dev/null
            printf "not-a-deb" > /tmp/unsigned.deb
            code=$(curl -s -o /tmp/rejected.json -w "%{http_code}" -b /tmp/admin.cookies -H "Origin: $origin" -X POST "$base/apps/nas-test/versions" -F "meta={\"version\":\"1.0\",\"arch\":\"amd64\",\"format\":\"deb\"}" -F "artifact=@/tmp/unsigned.deb")
            [ "$code" = 400 ]
            grep -q artifact_rejected /tmp/rejected.json
          '
          curl -fsS http://127.0.0.1:18080/metrics/server > /tmp/metrics.json
          jq -e --arg version "$VERSION" '.version == $version' /tmp/metrics.json
          docker rm -f zephyr-nas-test

      - name: Push arch image + offline tarball (tag builds)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "${{ runner.arch }}" in
            X64) ARCH=amd64 ;;
            ARM64) ARCH=arm64 ;;
            *) echo "unsupported runner arch"; exit 1 ;;
          esac
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker tag zephyr-nas:test "ghcr.io/eyebright/zephyr-hifi-kit-server:${VERSION}-${ARCH}"
          docker push "ghcr.io/eyebright/zephyr-hifi-kit-server:${VERSION}-${ARCH}"
          mkdir -p release
          docker tag zephyr-nas:test "zephyr-hifi-kit-server:${VERSION}"
          docker save "zephyr-hifi-kit-server:${VERSION}" | gzip > "release/Zephyr-HiFi-Kit-server-${VERSION}-docker-${ARCH}.tar.gz"
          gh release upload "$GITHUB_REF_NAME" "release/Zephyr-HiFi-Kit-server-${VERSION}-docker-${ARCH}.tar.gz" --clobber

  nas-manifest:
    needs: [meta, nas-image]
    if: github.ref_type == 'tag' && needs.meta.outputs.android_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Join arch images into a multi-arch index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker buildx imagetools create \
            -t "ghcr.io/eyebright/zephyr-hifi-kit-server:${VERSION}" \
            -t "ghcr.io/eyebright/zephyr-hifi-kit-server:latest" \
            "ghcr.io/eyebright/zephyr-hifi-kit-server:${VERSION}-amd64" \
            "ghcr.io/eyebright/zephyr-hifi-kit-server:${VERSION}-arm64"
          # Anonymous pull proof: token without credentials, then the index.
          if ! T=$(curl -fsS 'https://ghcr.io/token?scope=repository:eyebright/zephyr-hifi-kit-server:pull' | jq -er '.token'); then
            echo '::error::Anonymous GHCR access failed. Verify package connectivity and set zephyr-hifi-kit-server visibility to Public in GitHub package settings, then rerun this job.'
            exit 1
          fi
          curl -fsS -o /tmp/index.json -w 'anonymous index %{http_code}\n' \
            -H "Authorization: Bearer $T" \
            -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/eyebright/zephyr-hifi-kit-server/manifests/${VERSION}"
          grep -q arm64 /tmp/index.json && grep -q amd64 /tmp/index.json

  publish-release:
    needs: [meta, build, windows, audio, android, android-aaudio, nas-manifest]
    if: github.ref_type == 'tag' && needs.meta.outputs.android_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check all release assets and publish with SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ] || { echo "Refusing to modify a published release"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          assets=$(mktemp -d "$RUNNER_TEMP/zephyr-release-assets.XXXXXX")
          gh release download "$GITHUB_REF_NAME" --dir "$assets"
          # Fail closed if any required producer silently omitted an asset.
          for file in \
            "Zephyr-HiFi-Kit-server-$VERSION.tar.gz" \
            "Zephyr-HiFi-Kit-server-$VERSION-windows-amd64.zip" \
            "Zephyr-HiFi-Kit-terminal-$VERSION-linux.tar.gz" \
            "Zephyr-HiFi-Kit-terminal-$VERSION.apk"; do
            [ -s "$assets/$file" ] || { echo "Missing release asset: $file"; exit 1; }
          done
          for arch in amd64 arm64 armhf; do
            file="Zephyr-HiFi-Kit-terminal-$VERSION-linux-$arch.deb"
            [ -s "$assets/$file" ] || { echo "Missing release asset: $file"; exit 1; }
          done
          for target in windows-amd64 linux-amd64 linux-arm64; do
            file="Zephyr-HiFi-Kit-mcp-plugin-$VERSION-$target.zip"
            [ -s "$assets/$file" ] || { echo "Missing release asset: $file"; exit 1; }
          done
          for arch in amd64 arm64; do
            for file in \
              "Zephyr-HiFi-Kit-server-$VERSION-audio-$arch.tar.gz" \
              "Zephyr-HiFi-Kit-terminal-$VERSION-audio-$arch.tar.gz" \
              "Zephyr-HiFi-Kit-server-$VERSION-docker-$arch.tar.gz"; do
              [ -s "$assets/$file" ] || { echo "Missing release asset: $file"; exit 1; }
            done
          done
          # 0.4.3 clients resolve the legacy bundle name and root directory;
          # repack the identical bytes under them so the fleet can converge.
          legacy="zephyr-music-server-$VERSION"
          mkdir -p "$assets/.legacy"
          tar -xzf "$assets/Zephyr-HiFi-Kit-server-$VERSION.tar.gz" -C "$assets/.legacy"
          mv "$assets/.legacy/Zephyr-HiFi-Kit-server-$VERSION" "$assets/.legacy/$legacy"
          ( cd "$assets/.legacy" && tar -czf "$assets/$legacy.tar.gz" "$legacy" )
          rm -rf "$assets/.legacy"
          # Hash every downloaded asset (including any additional release assets),
          # excluding only the aggregate manifest itself on a draft-job rerun.
          ( cd "$assets" && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS )
          ( cd "$assets" && sha256sum --check --strict SHA256SUMS )
          gh release upload "$GITHUB_REF_NAME" "$assets/SHA256SUMS" "$assets/$legacy.tar.gz" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

  # Android hotfix line (v0.82.1-style tag): only the APK is produced and this job
  # publishes that single asset. The build job's packaging steps, the management
  # artifact and windows/audio/nas jobs are all skipped for this line, so the
  # release would otherwise stay a draft forever.
  publish-android-hotfix:
    needs: [meta, build, android, android-aaudio]
    if: github.ref_type == 'tag' && needs.meta.outputs.android_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the APK-only release with SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ] || { echo "Refusing to modify a published release"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          assets=$(mktemp -d "$RUNNER_TEMP/zephyr-hotfix-assets.XXXXXX")
          gh release download "$GITHUB_REF_NAME" --dir "$assets"
          apk="Zephyr-HiFi-Kit-terminal-$VERSION.apk"
          [ -s "$assets/$apk" ] || { echo "Missing release asset: $apk"; exit 1; }
          ( cd "$assets" && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
              | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS )
          ( cd "$assets" && sha256sum --check --strict SHA256SUMS )
          gh release upload "$GITHUB_REF_NAME" "$assets/SHA256SUMS" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
