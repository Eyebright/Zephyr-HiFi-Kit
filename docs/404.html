<!DOCTYPE html>

<meta name="theme-color" content="#07090d">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
.nf{min-height:100svh;display:grid;place-items:center;padding:24px;position:relative;z-index:2}
.nf-in{max-width:620px;text-align:center}
.nf-code{font:700 clamp(84px,18vw,168px)/.9 var(--disp);letter-spacing:-.04em;
  background:linear-gradient(120deg,var(--gold),var(--amber) 42%,var(--cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.nf h1{font:600 clamp(20px,3.4vw,28px)/1.3 var(--disp);margin:14px 0 10px}
.nf p{color:var(--muted);line-height:1.75;margin:0 0 26px}
.nf-act{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.nf-eq{display:flex;gap:5px;align-items:flex-end;justify-content:center;height:44px;margin:0 0 22px}
.nf-eq i{width:5px;border-radius:3px;background:linear-gradient(180deg,var(--gold),var(--amber));
  animation:nfb 1.5s ease-in-out infinite;opacity:.9}
@keyframes nfb{0%,100%{height:12px}50%{height:40px}}
@media (prefers-reduced-motion:reduce){.nf-eq i{animation:none;height:24px}}
</style>
</head>
<body>
<div class="bg-layer" aria-hidden="true">
  <div class="aurora a1"></div>
  <div class="aurora a2"></div>
  <div class="aurora a3"></div>
  <div class="grain"></div>
</div>
<main class="nf">
  <div class="nf-in">
    <div class="nf-eq" aria-hidden="true">
      <i style="animation-delay:0s"></i><i style="animation-delay:.12s"></i><i style="animation-delay:.24s"></i>
      <i style="animation-delay:.36s"></i><i style="animation-delay:.48s"></i><i style="animation-delay:.6s"></i>
      <i style="animation-delay:.72s"></i>
    </div>

      <a class="btn ghost" href="/zh.html" hreflang="zh-CN" lang="zh-CN">中文页面</a>
      <a class="btn ghost" href="https://github.com/Eyebright/Zephyr-HiFi-Kit/releases" target="_blank" rel="noopener">View Releases</a>
