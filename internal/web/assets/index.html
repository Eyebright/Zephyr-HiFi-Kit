<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080a0e">
<meta name="description" data-i18n-content="core.description" content="Zephyr HiFi Kit（和风HiFi音乐播放套件）运维控制台 — 主页、音乐库、终端中心、设置与操作日志">
<title data-i18n="core.title">Zephyr HiFi Kit · 运维控制台</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/library-browser.css">
<link rel="stylesheet" href="/settings.css">
<link rel="stylesheet" href="/experience.css">
<link rel="stylesheet" href="/favorites.css">
<link rel="stylesheet" href="/terminal-center.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect x='1' y='1' width='32' height='32' rx='9' fill='%23f6a821'/%3E%3Cpath d='M10 12h14l-14 10h14' stroke='%23080a0e' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<div class="bg-glow bg-glow-a" aria-hidden="true"></div>
<div class="bg-glow bg-glow-b" aria-hidden="true"></div>
<div class="bg-grain" aria-hidden="true"></div>

<div id="app">
  <button type="button" id="nav-backdrop" data-act="xp-nav-close" aria-label="关闭导航" data-i18n-aria-label="core.closeNavigation" tabindex="-1" hidden></button>
  <aside id="sidebar" aria-label="主导航" data-i18n-aria-label="core.navigation">
    <button type="button" id="mobile-nav-close" class="icon-btn" data-act="xp-nav-close" aria-label="关闭导航" data-i18n-aria-label="core.closeNavigation"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 34 34"><defs><linearGradient id="brandg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6a821"/><stop offset="1" stop-color="#ffd479"/></linearGradient></defs><rect x="1" y="1" width="32" height="32" rx="9" fill="url(#brandg)"/><path d="M10 12h14l-14 10h14" stroke="#080a0e" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Zephyr HiFi Kit</div>
        <div class="brand-sub" data-i18n="core.brand">和风HiFi音乐播放套件</div>
      </div>
      <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="brand-meta">
      <span id="brand-ver" class="ver-chip mono">v—</span>
      <span id="health-line" class="health-line">正在连接服务器…</span>
    </div>
    <nav id="nav" class="nav" aria-label="主导航" data-i18n-aria-label="core.navigation"></nav>
    <div class="side-foot">
      <div class="lbl">Zephyr HiFi Kit</div>
      <a href="mailto:services@zephyr.hk">services@zephyr.hk</a>
      <a href="https://www.zephyr.hk" target="_blank" rel="noopener">www.zephyr.hk</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button type="button" id="mobile-nav-toggle" class="icon-btn" data-act="xp-nav-toggle" aria-label="打开主导航" data-i18n-aria-label="core.openNavigation" aria-controls="sidebar" aria-expanded="false"><svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <div class="search-box">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="global-search" type="search" data-voice placeholder="搜索当前视图…（按 / 聚焦）" data-i18n-placeholder="core.searchPlaceholder" autocomplete="off" spellcheck="false" aria-label="全局搜索" data-i18n-aria-label="core.search">
      </div>
      <div class="top-right">
        <div id="conn" class="conn ok" title="服务器连接状态" data-i18n-title="core.connection"><span class="sdot live"></span><span id="conn-text">已连接</span></div>
        <button type="button" id="xp-account" class="btn ghost sm" data-act="settings-open" data-section="profile" aria-label="管理员与偏好"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0116 0v2"/></svg><span id="xp-account-label" class="xp-account-label">管理员</span></button>
        <button class="icon-btn" id="top-audit" data-act="audit-drawer" title="操作日志" data-i18n-title="core.operationLog" aria-label="操作日志" data-i18n-aria-label="core.operationLog">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9l-6-6z"/><path d="M14 3v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        </button>
        <button class="icon-btn bell" data-act="bell" title="告警中心" data-i18n-title="core.alerts" aria-label="告警中心" data-i18n-aria-label="core.alerts">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
          <span id="bell-count" class="bell-count hidden">0</span>
        </button>
      </div>
    </header>
    <div id="onboarding-root" hidden></div>
    <main id="view" class="view" aria-live="polite"></main>
    <div id="player-bar-root"></div>
  </div>
</div>

<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="toast-root" class="toast-root" aria-live="assertive"></div>
<script src="/i18n.js"></script>
<script src="/i18n-app.js"></script>
<script src="/i18n-settings.js"></script>
<script src="/i18n-features.js"></script>
<script src="/i18n-errors.js"></script>
<script src="/app.js"></script>
<script src="/library-browser.js"></script>
<script src="/settings.js"></script>
<script src="/experience.js"></script>
<script src="/favorites.js"></script>
<script src="/voice-search.js"></script>
<script src="/terminal-center.js"></script>
<script src="/terminal-install.js"></script>
</body>
</html>
