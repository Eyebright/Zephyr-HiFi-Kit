<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <title>Zephyr HiFi Kit · Android 播放终端</title>
  <link rel="stylesheet" href="/console.css">
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-disc" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3a9 9 0 0 1 9 9M12 21a9 9 0 0 1-9-9"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16 8a6 6 0 0 1 0 8M19 5a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-queue" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7M17 15v6M14 18h6"/></symbol>
    <symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M5 5h14M5 10h9M5 15h14M5 20h7"/><circle cx="18" cy="10" r="2"/></symbol>
    <symbol id="i-output" viewBox="0 0 24 24"><path d="M4 14v-4a8 8 0 0 1 16 0v4"/><rect x="2" y="12" width="4" height="8" rx="2"/><rect x="18" y="12" width="4" height="8" rx="2"/></symbol>
  </svg>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">Z</div>
        <div class="brand-copy">
          <strong>Zephyr HiFi Kit</strong>
          <span>Android 播放终端</span>
        </div>
      </div>
      <div class="header-status">
        <span id="terminal-name" class="terminal-name">—</span>
        <span id="connection" class="status-pill"><i></i><span>连接中</span></span>
      </div>
    </header>

    <main class="console">
      <section class="player-pane" aria-label="正在播放">
        <div class="now-playing">
          <div class="artwork" id="artwork">
            <div class="art-fallback">
              <svg class="icon"><use href="#i-disc"></use></svg>
              <span>ZEPHYR</span>
            </div>
            <img id="cover" alt="专辑封面" hidden>
          </div>

          <div class="track-info">
            <div class="state-row">
              <div class="eyebrow" id="playback-state">等待播放</div>
              <span id="link-chip" class="link-chip"><i></i><span id="link-chip-text">连接中</span></span>
            </div>
            <h1 id="title">等待服务端推送音乐</h1>
            <p id="artist" class="artist">从服务端播放列表选择一首曲目</p>
            <p id="album" class="album"></p>
            <div id="format" class="format"></div>
            <div id="badges" class="badges"></div>
          </div>
        </div>

        <div class="timeline">
          <span id="elapsed" class="time">0:00</span>
          <input id="seek" type="range" min="0" max="0" step="1000" value="0" aria-label="播放进度" disabled>
          <span id="duration" class="time">0:00</span>
        </div>

        <div class="transport" aria-label="播放控制">
          <button id="prev" class="transport-button secondary" type="button" aria-label="上一首" title="上一首" disabled>
            <svg class="icon"><use href="#i-prev"></use></svg>
            <span>上一首</span>
          </button>
          <button id="play-pause" class="transport-button primary" type="button" aria-label="暂停" title="暂停" disabled>
            <svg class="icon"><use id="play-icon" href="#i-play"></use></svg>
            <span id="play-label">播放</span>
          </button>
          <button id="next" class="transport-button secondary" type="button" aria-label="下一首" title="下一首" disabled>
            <svg class="icon"><use href="#i-next"></use></svg>
            <span>下一首</span>
          </button>
          <button id="stop" class="transport-button stop" type="button" aria-label="停止" title="停止" disabled>
            <svg class="icon"><use href="#i-stop"></use></svg>
            <span>停止</span>
          </button>
        </div>

        <div class="secondary-controls">
          <div class="volume-control">
            <svg class="icon"><use href="#i-volume"></use></svg>
            <label for="volume" class="visually-hidden">音量</label>
            <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="音量">
            <span id="volume-value">100%</span>
          </div>
          <div class="output-pill" title="当前音频输出">
            <svg class="icon"><use href="#i-output"></use></svg>
            <span id="output">AAudio 默认输出</span>
          </div>
        </div>

        <div class="telemetry" aria-label="播放状态">
          <div><span>缓冲</span><strong id="buffer">0 ms</strong></div>
          <div><span>队列</span><strong id="queue-position">—</strong></div>
          <div><span>服务端</span><strong id="server-state">检查中</strong></div>
        </div>
      </section>

      <div id="pane-resizer" class="pane-resizer" role="separator" aria-orientation="vertical" aria-label="拖动调整歌词/播放列表宽度" title="拖动调整宽度"><i></i></div>

      <div class="side-pane">
        <div class="pane-tabs" role="tablist" aria-label="歌词与播放列表切换">
          <button id="tab-lyrics" class="pane-tab active" type="button" role="tab" aria-selected="true">歌词</button>
          <button id="tab-queue" class="pane-tab" type="button" role="tab" aria-selected="false">播放列表</button>
        </div>

        <section id="lyrics-pane" class="lyrics-pane" aria-label="歌词">
        <div class="lyrics-header">
          <div>
            <div class="eyebrow">LYRICS</div>
            <h2>歌词</h2>
          </div>
          <span id="lyrics-status" class="lyrics-status">等待播放</span>
        </div>
        <div id="lyrics-list" class="lyrics-list" aria-live="polite"></div>
        <div id="lyrics-empty" class="lyrics-empty">
          <svg class="icon"><use href="#i-lyrics"></use></svg>
          <strong id="lyrics-empty-title">暂无歌词</strong>
          <span id="lyrics-empty-detail">播放曲目后，这里会显示服务端缓存的内嵌歌词或同名 LRC 歌词</span>
        </div>
        <div id="lyrics-footer" class="lyrics-footer">歌词由服务端统一缓存 · 随播放进度同步</div>
        </section>

        <section id="queue-pane" class="queue-pane" aria-label="播放列表" hidden>
        <div class="queue-header">
          <div>
            <div class="eyebrow">PLAY QUEUE</div>
            <h2>播放列表</h2>
          </div>
          <span id="queue-count" class="queue-count">0</span>
        </div>
        <div id="queue-list" class="queue-list"></div>
        <div id="queue-empty" class="queue-empty">
          <svg class="icon"><use href="#i-queue"></use></svg>
          <strong>播放列表为空</strong>
          <span>在服务端控制台选择音乐后，这里会同步显示</span>
        </div>
        <div class="queue-footer">播放列表保存在服务端 · 点击曲目可直接播放</div>
        </section>
      </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>
  <script src="/console.js"></script>
</body>
</html>
